<title>Quantum Surge</title>
<style>
/* A viewer for one in-game event. Single dark look on purpose: it is the game's screen. */
:root { --bg: #050407; --bar: #0d0b10; --line: #26222c; --fg: #c9c4d4; --muted: #8a8496; --ok: #8fd69a; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: 'Courier New', monospace; }
.viewer { min-height: 100%; display: flex; flex-direction: column; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 18px; background: var(--bar); border-bottom: 1px solid var(--line); font-size: 16px; }
.ctl h1 { margin: 0; font-size: 17px; letter-spacing: 3px; font-weight: 900; color: var(--fg); }
.ctl .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ctl label { color: var(--muted); letter-spacing: 1px; }
.ctl select, .ctl button { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; max-width: 100%; }
.ctl button { cursor: pointer; font-weight: 700; letter-spacing: 1px; }
.ctl button:hover, .ctl button:focus-visible { border-color: var(--fg); outline: none; }
.ctl .note { flex-basis: 100%; color: var(--muted); font-size: 15px; line-height: 1.5; }
.ctl .out { color: var(--ok); }
.stagehost { position: relative; flex: 1; display: flex; min-height: 620px; }
.stagehost > .dks { flex: 1; }
.gate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px 16px; text-align: center; }
.gate h2 { margin: 0; font-size: clamp(26px, 5vw, 44px); letter-spacing: 6px; color: var(--accent); }
.gate p { margin: 0; max-width: 40rem; color: var(--fg); font-size: 18px; line-height: 1.6; }
.gate button { font: inherit; font-size: 20px; font-weight: 900; letter-spacing: 4px; padding: 16px 32px; color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 6px; cursor: pointer; }
.gate button:hover, .gate button:focus-visible { background: rgba(255,255,255,0.06); outline: none; }

/* ═══════════════════════════════════════════════════════════════════════════
   world_scene.css — the seven WORLD EVENTS on the 1920×1080 canvas.
   The scene is see-through and click-through; only what it hands you is live.
   ═══════════════════════════════════════════════════════════════════════════ */
.dks.wx { --wx: #44ffcc; padding: 0; background: transparent; pointer-events: none; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color: #fff; text-align: left; }
.wx-sting, .wx-amb, .wx-fx, .wx-play { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.wx-sting { opacity: 0; transition: opacity 0.6s; z-index: 4; }
.wx-sting-on .wx-sting { opacity: 1; transition: none; }
.wx-fx { z-index: 6; }
.wx-play { z-index: 5; }
.wx-off .wx-amb, .wx-off .wx-play, .wx-ending .wx-amb { opacity: 0; transition: opacity 0.8s; }
.wx-ending .wx-play { opacity: 0.6; }

/* the banner */
.wx-banner { position: absolute; left: 0; right: 0; top: 0; min-height: 170px; display: flex; align-items: center; gap: 32px; padding: 12px 44px 16px; box-sizing: border-box; z-index: 7;
    background: linear-gradient(90deg, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.82)), var(--wx); border-bottom: 2px solid var(--wx); box-shadow: 0 6px 40px -10px var(--wx);
    transform: translateY(-130%); transition: transform 0.5s cubic-bezier(.2,1.2,.4,1); }
.wx-on .wx-banner { transform: none; }
.wx-off .wx-banner { transform: translateY(-130%); transition: transform 0.5s cubic-bezier(.6,0,.8,.4); }
.wx-icon { flex: none; width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 62px; color: #000; background: var(--wx); box-shadow: 0 0 30px var(--wx); }
.wx-on .wx-icon { animation: wx-pop 0.5s 0.3s cubic-bezier(.3,1.6,.5,1) both; }
.wx-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.wx-txt b { font-size: 66px; line-height: 1; font-weight: 900; letter-spacing: 5px; color: var(--wx); text-shadow: 0 0 24px var(--wx); }
.wx-txt span { font-size: 36px; line-height: 1.22; letter-spacing: 0.5px; color: rgba(255, 255, 255, 0.86); }
.wx-ending .wx-txt span { color: #fff; animation: wx-in 0.4s both; }
.wx-chip { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; position: relative; padding-left: 32px; border-left: 2px solid rgba(255, 255, 255, 0.14); }
.wx-chip em { font-style: normal; font-size: 28px; line-height: 1.1; letter-spacing: 3px; color: rgba(255, 255, 255, 0.72); white-space: nowrap; }
.wx-chip b { font-size: 56px; line-height: 1.05; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wx-chip .wx-lock { font-style: normal; color: #ffcc66; }
.wx-time { flex: none; display: flex; align-items: baseline; gap: 4px; min-width: 150px; justify-content: flex-end; }
.wx-time b { font-size: 88px; line-height: 1; font-weight: 900; color: var(--wx); font-variant-numeric: tabular-nums; }
.wx-time span { font-size: 36px; font-weight: 700; color: rgba(255, 255, 255, 0.72); }
.wx-bar { position: absolute; left: 0; right: 0; bottom: -2px; height: 8px; background: rgba(255, 255, 255, 0.08); }
.wx-bar s { display: block; height: 100%; background: var(--wx); transform-origin: left; box-shadow: 0 0 12px var(--wx); }
.wx-pop { animation: wx-pop 0.35s cubic-bezier(.3,1.6,.5,1); }

/* shared bits */
.wx-spark { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--wx); box-shadow: 0 0 10px var(--wx); animation: wx-spark 0.7s ease-out forwards; }
.wx-float { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 56px; font-weight: 900; color: #fff; text-shadow: 0 0 14px var(--wx); animation: wx-floatup 1.2s ease-out forwards; }

/* QUANTUM SURGE */
.wx-ring { position: absolute; left: 860px; top: 460px; width: 200px; height: 200px; border-radius: 50%; border: 6px solid var(--wx); box-shadow: 0 0 40px var(--wx), inset 0 0 40px var(--wx); animation: wx-ring 1.3s ease-out both; }
.wx-ring:nth-child(2) { animation-delay: 0.15s; } .wx-ring:nth-child(3) { animation-delay: 0.3s; }
.wx-surge .wx-amb { box-shadow: inset 0 0 160px -20px rgba(68, 255, 204, 0.55); animation: wx-glow 1.4s ease-in-out infinite; }
.wx-streak { position: absolute; bottom: -140px; width: 3px; height: 140px; border-radius: 2px; background: linear-gradient(transparent, var(--wx)); animation: wx-rise linear infinite; opacity: 0.8; }

/* DATA STORM */
.wx-static { position: absolute; left: 0; right: 0; top: 0; height: 1080px; background: repeating-linear-gradient(rgba(170, 170, 255, 0.25) 0 2px, transparent 2px 7px, rgba(255, 255, 255, 0.12) 7px 8px, transparent 8px 15px);
    animation: wx-sweep 0.9s ease-out both; }
.wx-orb { position: absolute; width: 88px; height: 88px; margin: -44px 0 0 -44px; padding: 0; border-radius: 50%; border: 2px solid rgba(190, 190, 255, 0.95); cursor: pointer; pointer-events: auto;
    background: radial-gradient(circle, #e0e0ff 0%, #9a9aff 35%, rgba(80, 80, 220, 0.35) 100%); box-shadow: 0 0 26px rgba(150, 150, 255, 0.95);
    display: flex; align-items: center; justify-content: center; color: #fff; animation: wx-orb 9s ease-out forwards; transition: opacity 0.4s; }
.wx-orb i { font-style: normal; font-size: 40px; line-height: 1; filter: drop-shadow(0 0 4px #33f); }
.wx-orb:hover, .wx-orb:focus-visible { outline: none; box-shadow: 0 0 40px #fff; }
.wx-orb.wx-gone { opacity: 0; pointer-events: none; }
.wx-spark-storm { background: #bbbbff; }

/* WALKER STRIKE */
.wx-red { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(255, 30, 60, 0.45)); animation: wx-fadein 0.3s both; }
.wx-stamp { position: absolute; left: 0; right: 0; top: 420px; text-align: center; font-size: 170px; font-weight: 900; letter-spacing: 30px; color: transparent; -webkit-text-stroke: 6px #ff5566; transform: rotate(-6deg); animation: wx-slam 0.5s cubic-bezier(.3,1.6,.5,1) both; }
.wx-tint { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(40, 0, 10, 0.08), rgba(60, 0, 15, 0.45)); transition: opacity 1s; }
.wx-agree .wx-tint { opacity: 0; }
.wx-striker { position: absolute; bottom: 24px; width: 230px; height: 330px; margin-left: -115px; padding: 0; border: none; background: none; cursor: pointer; pointer-events: auto;
    animation: wx-march 1.8s cubic-bezier(.2,.8,.3,1) backwards; transition: transform 1.4s 0.7s ease-in, opacity 0.8s 1.2s; }
.wx-striker svg { position: absolute; left: 70px; bottom: 0; width: 90px; height: 180px; animation: wx-bob 0.55s ease-in-out infinite alternate; }
.wx-wk { fill: #e2d4cc; } .wx-wkl { fill: none; stroke: #e2d4cc; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.wx-sign { position: absolute; left: 0; right: 0; top: 0; padding: 10px 8px; box-sizing: border-box; background: #f4ecd8; color: #c4202e; font-size: 32px; font-weight: 900; letter-spacing: 0.5px; text-align: center; line-height: 1.1;
    border: 4px solid #6a4a2a; border-radius: 4px; transform: rotate(-4deg); animation: wx-wave 0.9s ease-in-out infinite alternate; transition: transform 0.4s, opacity 0.4s; }
.wx-sign::after { content: ''; position: absolute; left: 50%; top: 100%; width: 6px; height: 70px; margin-left: -3px; background: #6a4a2a; }
.wx-striker:nth-child(even) .wx-sign { transform: rotate(5deg); animation-delay: 0.3s; }
.wx-striker:hover .wx-sign, .wx-striker:focus-visible .wx-sign { background: #fff; outline: none; }
.wx-striker:focus-visible { outline: 3px solid #ff5566; outline-offset: 4px; }
.wx-cup { position: absolute; left: 91px; top: 170px; font-style: normal; font-size: 48px; color: #f4ecd8; opacity: 0; transform: scale(0.3); transition: opacity 0.25s, transform 0.25s cubic-bezier(.3,1.6,.5,1); }
.wx-striker.wx-ok { pointer-events: none; transform: translateX(700px); opacity: 0; }
.wx-striker.wx-ok .wx-cup { opacity: 1; transform: none; }
.wx-striker.wx-ok .wx-sign { animation: none; opacity: 0; transform: rotate(70deg) translateY(60px); }

/* MOMENTUM CASCADE */
.wx-chev { position: absolute; top: -160px; font-style: normal; font-size: 130px; line-height: 1; color: var(--wx); filter: drop-shadow(0 0 16px var(--wx)); animation: wx-fall 1.3s cubic-bezier(.5,0,.8,.6) both; }
.wx-cascade .wx-amb { box-shadow: inset 0 0 140px -30px rgba(255, 170, 68, 0.6); animation: wx-glow 0.4s ease-in-out infinite; }
.wx-spark-cascade { background: #ffcc66; box-shadow: 0 0 12px #ff8a20; }

/* CORRUPT PACKET */
.wx-blk { position: absolute; background: #ff3366; mix-blend-mode: screen; opacity: 0; animation: wx-glitch 0.12s steps(2) 8 both; }
.wx-blk:nth-child(3n) { background: #33ffee; } .wx-blk:nth-child(3n+1) { background: #fff; }
.wx-skull { position: absolute; left: 0; right: 0; top: 340px; text-align: center; font-size: 300px; line-height: 1; color: var(--wx); filter: drop-shadow(0 0 30px var(--wx)); animation: wx-slam 0.5s cubic-bezier(.3,1.6,.5,1) both; }
.wx-burst { position: absolute; left: 0; right: 0; top: 720px; text-align: center; font-size: 96px; font-weight: 900; color: #fff; text-shadow: 0 0 40px var(--wx); animation: wx-burst 2.2s ease-out forwards; }
.wx-card { position: absolute; left: 60px; top: 300px; width: 620px; padding: 26px 30px; box-sizing: border-box; display: grid; grid-template-columns: 1fr; gap: 18px; align-items: center;
    background: rgba(20, 0, 8, 0.94); border: 2px solid var(--wx); border-radius: 12px; box-shadow: 0 0 40px -6px var(--wx); animation: wx-in 0.35s both; transition: opacity 0.8s, border-color 0.3s; }
.wx-card em { display: block; margin-bottom: 6px; font-style: normal; font-size: 30px; letter-spacing: 3px; color: #ff8aa0; }
.wx-card b { font-size: 56px; line-height: 1.1; font-weight: 900; }
.wx-q { font: inherit; font-size: 36px; font-weight: 900; letter-spacing: 4px; padding: 22px 30px; color: #fff; background: #c4203e; border: none; border-radius: 10px; cursor: pointer; pointer-events: auto; box-shadow: 0 0 24px #ff3366; }
.wx-q:hover, .wx-q:focus-visible { background: #e02a4c; outline: 3px solid #fff; }
.wx-q:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
.wx-qbar { grid-column: 1 / -1; display: block; height: 10px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.wx-qbar s { display: block; height: 100%; background: #ff3366; transform: scaleX(0); transform-origin: left; transition-property: transform; transition-timing-function: linear; }
.wx-card.wx-saved { border-color: #4fd08a; box-shadow: 0 0 40px -6px #4fd08a; } .wx-card.wx-saved em { color: #7dffb0; }
.wx-card.wx-lost b { color: #ff6a80; animation: wx-shake 0.1s steps(2) 6; }
.wx-card.wx-fade { opacity: 0; }

/* TIME FREEZE */
.wx-flash { position: absolute; inset: 0; background: #dff4ff; animation: wx-flashout 0.8s ease-out both; }
.wx-frost { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 52%, transparent 55%, rgba(190, 230, 255, 0.35) 75%, rgba(225, 245, 255, 0.75) 100%);
    animation: wx-frost 1.4s ease-out both; transition: opacity 1s; }
.wx-thaw .wx-frost { opacity: 0; }
.wx-flake { position: absolute; top: -60px; font-style: normal; font-size: 26px; color: rgba(230, 245, 255, 0.75); animation: wx-snow linear infinite; }
.wx-spark-ice { background: #e8f8ff; box-shadow: 0 0 12px #88ddff; border-radius: 2px; }

/* MEMORY PURGE */
.wx-del { position: absolute; left: 0; right: 0; top: 380px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.wx-num { font-family: 'Courier New', monospace; font-size: 150px; font-weight: 900; color: #fff; text-shadow: 0 0 40px var(--wx); min-height: 170px; }
.wx-line { display: flex; align-items: center; gap: 10px; }
.wx-caret { width: 10px; height: 140px; background: var(--wx); animation: wx-blink 0.5s steps(1) infinite; }
.wx-halved .wx-caret { display: none; }
.wx-del em { font-style: normal; font-size: 46px; font-weight: 900; letter-spacing: 8px; color: #ff6a80; opacity: 0; }
.wx-halved .wx-del em { opacity: 1; animation: wx-slam 0.4s cubic-bezier(.3,1.6,.5,1) both; }
.wx-scan { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--wx); box-shadow: 0 0 20px var(--wx); opacity: 0.35; animation: wx-scan 3.2s linear infinite; }
.wx-rec { position: absolute; right: 40px; top: 560px; width: 560px; padding: 22px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; background: rgba(0, 10, 20, 0.88); border: 2px solid rgba(51, 200, 255, 0.5); border-radius: 12px; }
.wx-rec span { font-size: 30px; font-weight: 700; letter-spacing: 3px; color: rgba(255, 255, 255, 0.8); }
.wx-rec small { font-size: 34px; line-height: 1.3; color: rgba(255, 255, 255, 0.86); }
.wx-rec i { display: block; height: 12px; border-radius: 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.wx-rec s { display: block; height: 100%; background: var(--wx); transform: scaleX(0); transform-origin: left; }
.wx-rec b { font-size: 56px; line-height: 1.05; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wx-frag { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: var(--wx); box-shadow: 0 0 12px var(--wx); animation: wx-frag 0.65s cubic-bezier(.5,0,.7,.5) forwards; }
@keyframes wx-frag { to { transform: translate(var(--dx), var(--dy)) scale(0.4); opacity: 0.4; } }

@keyframes wx-pop     { from { transform: scale(1.5); } }
@keyframes wx-in      { from { opacity: 0; transform: translateY(10px); } }
@keyframes wx-fadein  { from { opacity: 0; } }
@keyframes wx-spark   { from { transform: translate(0, 0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; } }
@keyframes wx-floatup { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, -150%); } }
@keyframes wx-ring    { from { transform: scale(0.2); opacity: 1; } to { transform: scale(7); opacity: 0; } }
@keyframes wx-glow    { 50% { opacity: 0.55; } }
@keyframes wx-rise    { to { transform: translateY(-1360px); } }
@keyframes wx-sweep   { from { transform: translateY(-100%); opacity: 1; } to { transform: translateY(100%); opacity: 0.3; } }
@keyframes wx-orb     { 0% { transform: scale(0.2); opacity: 0; } 8% { transform: scale(1.1); opacity: 1; } 12% { transform: scale(1); } 100% { transform: translate(var(--drift), -180px); } }
@keyframes wx-slam    { from { opacity: 0; transform: rotate(-6deg) scale(2); } }
@keyframes wx-march   { from { transform: translateX(-2000px); } }
@keyframes wx-bob     { to { transform: translateY(-8px); } }
@keyframes wx-wave    { to { transform: rotate(4deg) translateY(-6px); } }
@keyframes wx-fall    { from { transform: translateY(0); opacity: 1; } to { transform: translateY(1400px); opacity: 0.2; } }
@keyframes wx-glitch  { 0% { opacity: 0.9; transform: translateX(-20px); } 100% { opacity: 0.2; transform: translateX(30px); } }
@keyframes wx-burst   { 0% { opacity: 0; transform: scale(0.5); } 15% { opacity: 1; transform: scale(1.1); } 30% { transform: scale(1); } 100% { opacity: 0; transform: translateY(-120px); } }
@keyframes wx-shake   { 50% { transform: translateX(-5px); } }
@keyframes wx-flashout { from { opacity: 0.9; } to { opacity: 0; } }
@keyframes wx-frost   { from { opacity: 0; transform: scale(1.15); } }
@keyframes wx-snow    { to { transform: translateY(1200px) rotate(200deg); } }
@keyframes wx-blink   { 50% { opacity: 0; } }
@keyframes wx-scan    { to { transform: translateY(1080px); } }

/* reduced motion: nothing falls, flies, sweeps or flickers; everything still says what happened */
.dks.wx.dks-reduced .wx-streak, .dks.wx.dks-reduced .wx-flake, .dks.wx.dks-reduced .wx-chev, .dks.wx.dks-reduced .wx-blk, .dks.wx.dks-reduced .wx-static, .dks.wx.dks-reduced .wx-scan, .dks.wx.dks-reduced .wx-ring { display: none; }
@media (prefers-reduced-motion: reduce) { .dks.wx .wx-streak, .dks.wx .wx-flake, .dks.wx .wx-chev, .dks.wx .wx-blk, .dks.wx .wx-static, .dks.wx .wx-scan, .dks.wx .wx-ring { display: none; } }


.dks-fit > .board { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.board { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,204,85,0.06), transparent 70%), #07060a; transition: filter 0.8s, opacity 0.8s; }
.board.blur { filter: blur(10px); opacity: 0.5; }
.board .hud { display: flex; gap: 90px; justify-content: center; font-size: 28px; letter-spacing: 4px; color: var(--muted); }
.board .hud b { display: block; margin-top: 6px; font-size: 60px; letter-spacing: 3px; color: var(--fg); font-variant-numeric: tabular-nums; }
.board .acq { width: 380px; height: 380px; border-radius: 50%; border: 4px solid #ffcc55; background: radial-gradient(circle at 40% 35%, rgba(255,204,85,0.28), rgba(255,204,85,0.04) 70%); color: #ffcc55; font: inherit; font-weight: 900; font-size: 40px; letter-spacing: 8px; cursor: pointer; box-shadow: 0 0 90px -30px #ffcc55; transition: transform 0.08s; }
.board .acq:active { transform: scale(0.95); }
.board .acq:disabled { opacity: 0.15; cursor: default; }
.board .gens { display: grid; grid-template-columns: repeat(3, 380px); gap: 20px; font-size: 28px; letter-spacing: 1px; color: var(--fg); }
.board .gens div { border: 1px solid var(--line); border-radius: 8px; padding: 16px 22px; display: flex; justify-content: space-between; }
.board .tip { font-size: 32px; letter-spacing: 1px; line-height: 1.35; color: var(--fg); text-align: center; max-width: 1500px; }
.sceneLayer { position: absolute; inset: 0; }
.sceneLayer[hidden] { display: none; }

.board { padding-top: 170px; gap: 28px; }                 /* the world-event banner (up to ~200px) never covers the hud */
.board .hud { gap: 70px; }
.board .gens div.hit { border-color: #ff3366; color: #ff8aa0; }
.board .tag { display: block; margin-top: 6px; font-size: 26px; letter-spacing: 3px; color: #ff6a80; min-height: 22px; }

:root { --accent: #44ffcc; }
/* ═══════════════════════════════════════════════════════════════════════════
   duck_scenes.css — THE DUCKY COUNCIL and THE DUCK TRIBUNAL, staged.

   Rules (same contract as duck_tribunal_art.js / duck_council_art.js):
   · transform and opacity only — these scenes open while the income loop runs;
   · no colour baked into the art — shapes stroke currentColor, fill via .pf;
   · base state is VISIBLE; a keyframe animates FROM hidden. Suppress the
     animation (reduced motion, safe mode, accessibility mode) and the scene is
     still all there.
   Everything is scoped under .dks so nothing leaks into the rest of game.css.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── THE 16:9 CANVAS ─────────────────────────────────────────────────────
   Every scene is laid out on a fixed 1920×1080 canvas and scaled to fit the
   screen (D.fit). Wider or taller screens — 3440×1440 included — get dark
   edges. --r / --vh / --vw are the canvas's own rem and viewport units, so
   the sizes below mean the same thing on every monitor. */
.dks-fit { position: absolute; inset: 0; overflow: hidden; overflow: clip; background: #000; }   /* clip: focus must never scroll the frame */
.dks-ic { display: inline-block; width: 1em; height: 1em; vertical-align: -0.14em; overflow: visible; }
.dks-fit.dks-see { background: transparent; }                                       /* a scene drawn over the live game */
.dks-fit > .dks { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; min-height: 0; transform-origin: 0 0; }

.dks {
    --r: 26px;
    --vh: 10.8px;
    --vw: 19.2px;
    --dks-ink: #e8c547;
    --dks-dim: rgba(232, 197, 71, 0.45);
    --dks-bg: #07060a;
    --dks-paper: #12100a;
    --seat-h: 260px;                                   /* on the 1080 canvas: the bench is the scene */
    --seat-w: calc(var(--seat-h) * 112 / 150);
    --duck: calc(var(--seat-h) * 0.47);
    --duck-bottom: calc(var(--seat-h) * 42 / 150);
    --approve: #7fdc8a;
    --reject: #ff6a55;
    --abstain: #8a90a6;

    position: relative;
    width: 100%;
    min-height: 100%;
    box-sizing: border-box;
    padding: 18px 50px 14px;
    justify-content: flex-start;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--dks-ink);
    background: radial-gradient(ellipse 70% 60% at 50% 30%, rgba(255, 220, 90, 0.06), transparent 70%), var(--dks-bg);
    font-family: 'Courier New', monospace;
    text-align: center;
    overflow: hidden;
    overflow: clip;                                    /* nothing inside may scroll the scene */
    user-select: none;
}
.dks *, .dks *::before, .dks *::after { box-sizing: border-box; }
.dks svg { stroke: currentColor; overflow: hidden; }
.dks .pf { fill: currentColor; fill-opacity: 0.08; }

/* ── header ─────────────────────────────────────────────────────────────── */
/* TYPE SCALE (canvas px): nothing readable under 24; labels 26–30; dialogue 36; buttons 32; titles 54+ */
.dks-eyebrow { font-size: 26px; letter-spacing: 4px; opacity: 0.7; }
.dks-title   { font-size: 50px; letter-spacing: 6px; font-weight: 900; margin: 2px 0 0; line-height: 1.1; }
.dks-sub     { font-size: 26px; letter-spacing: 3px; opacity: 0.75; }
.dks-on-in .dks-title { animation: dks-stamp-title 0.55s cubic-bezier(.2,1.6,.4,1) both; }

/* ── stage ──────────────────────────────────────────────────────────────── */
.dks-stage {
    position: relative;
    width: 100%;
    max-width: 1700px;
    margin-top: 4px;
    padding-top: 24px;                                 /* speech goes in the dialogue box; the short murmurs sit inside the stalls */
    display: flex;
    flex-direction: column;
    align-items: center;
}
.dks-backdrop {
    position: absolute;
    inset: 0 0 calc(var(--seat-h) * 0.25) 0;
    pointer-events: none;
    opacity: 0.85;
}
.dks-backdrop svg { width: 100%; height: 100%; }
.dks-on-in .dks-backdrop { animation: dks-lights 1.1s ease-out both; }
.dks-shake { animation: dks-shake 0.36s linear; }

.dks-row { position: relative; display: flex; justify-content: center; z-index: 1; }

.dks-seat {
    position: relative;
    width: var(--seat-w);
    height: var(--seat-h);
    flex: 0 0 auto;
    margin: 0;                                         /* stalls abut into one bench */
    transition: opacity 0.5s;
}
.dks-furn, .dks-furn svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dks-duck {
    position: absolute;
    left: 50%;
    bottom: var(--duck-bottom);
    width: var(--duck);
    height: var(--duck);
    margin-left: calc(var(--duck) / -2);
    transform-origin: 50% 100%;
    transition: transform 0.5s cubic-bezier(.3,1.3,.5,1);
    z-index: 2;
}
.dks-face, .dks-bob { width: 100%; height: 100%; transform-origin: 50% 100%; }
.dks-face { transition: transform 0.32s ease-in-out; }
.dks-bob svg { width: 100%; height: 100%; display: block; }
.dks-fallback { font-size: calc(var(--duck) * 0.8); line-height: 1; }

/* the cast's parts */
.dks .dk-body.pf      { fill-opacity: 0.16; }
.dks .dk-wing.pf      { fill-opacity: 0.26; }
.dks .dk-eye.pf       { fill-opacity: 1; stroke: none; }
.dks .dk-sash.pf      { fill-opacity: 0.55; }
.dks .dk-medal.pf     { fill-opacity: 0.9; }
.dks .dk-mark, .dks .dk-seam, .dks .dk-valve { stroke-width: 1.8; opacity: 0.8; }
.dks .dk-shine        { stroke-width: 2; opacity: 0.7; }
.dks .dk-billroot, .dks .dk-billline, .dks .dk-specs, .dks .dk-chain { stroke-width: 2; }

/* blink — every member but the one who never moves (seat 4) and Rubber III, whose socket is empty */
.dks .dk-eye { transform-box: fill-box; transform-origin: center; animation: dks-blink 5.2s infinite; }
.dks .dks-seat-1 .dk-eye { animation-delay: -1.7s; animation-duration: 6.1s; }
.dks .dks-seat-3 .dk-eye { animation-delay: -3.3s; animation-duration: 4.7s; }
.dks .dks-seat-4 .dk-eye { animation: none; }

/* facing: the art faces right; .dks-look-left turns a member toward a speaker on its left */
.dks-look-left .dks-face { transform: scaleX(-1); }

/* talking: the body bobs and the bill works. The Abstainer has no bill line, so he cannot. */
.dks-talking .dks-bob { animation: dks-talk 0.26s ease-in-out infinite alternate; }
.dks-talking .dk-billline { transform-box: fill-box; transform-origin: left center; animation: dks-yap 0.15s steps(2) infinite; }
.dks-seat-4.dks-talking .dks-bob { animation: none; }               /* no mouth, no motion */
.dks-gesture .dks-bob { animation: dks-hop 0.5s cubic-bezier(.3,1.6,.5,1); }

/* ── speech bubbles — anchored above each seat, no measuring ─────────────── */
.dks-anchor {
    position: absolute;
    bottom: calc(100% - var(--seat-h) * 0.04);
    left: 50%;
    width: 560px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 5;
    --tail: 50%;
}
.dks-seat-0 .dks-anchor { left: 0; transform: none; --tail: calc(var(--seat-w) / 2); }
.dks-seat-4 .dks-anchor { left: auto; right: 0; transform: none; --tail: calc(100% - var(--seat-w) / 2); }
.dks-bubble {
    position: relative;
    display: none;
    padding: 10px 18px 12px;
    background: rgba(10, 9, 14, 0.94);
    border: 1px solid currentColor;
    border-radius: 10px;
    text-align: left;
    box-shadow: 0 0 18px rgba(0, 0, 0, 0.6);
    transform-origin: var(--tail) 100%;
}
.dks-bubble::after {
    content: '';
    position: absolute;
    top: 100%;
    left: var(--tail);
    width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    background: inherit;
    border-right: 1px solid currentColor;
    border-bottom: 1px solid currentColor;
    transform: rotate(45deg);
}
.dks-bubble.dks-on { display: block; animation: dks-pop 0.22s cubic-bezier(.2,1.5,.5,1) both; }
.dks-who { font-size: 26px; letter-spacing: 3px; opacity: 0.8; margin-bottom: 4px; }
.dks-say { font-size: 34px; line-height: 1.35; color: #f1eee4; min-height: 1.2em; }
.dks-bubble.dks-action .dks-say { font-style: italic; color: #aab0c4; }
.dks-bubble.dks-murmur { padding: 4px 16px; width: max-content; margin: 0 auto; }
.dks-bubble.dks-murmur .dks-who { display: none; }

.dks-caption {
    min-height: 1.3em;
    margin-top: 6px;
    font-size: 28px;
    letter-spacing: 3px;
    opacity: 0.85;
}

/* the dialogue box: one wide subtitle panel under the bench, pointing at whoever speaks */
.dks-dialog { position: relative; width: 1560px; min-height: 166px; margin-top: 12px; }
.dks-dialog .dks-bubble { position: relative; display: block; padding: 14px 30px 18px; border-radius: 12px; opacity: 0; transition: opacity 0.2s; }
.dks-dialog .dks-bubble.dks-on { opacity: 1; animation: none; }
.dks-dialog .dks-bubble::after { top: -6px; bottom: auto; left: calc(50% + var(--speaker, 0) * var(--seat-w)); transform: rotate(225deg); }
.dks-anchor { bottom: calc(100% - 64px); }                    /* murmurs inside the stall, over the member */
.dks-council .dks-ledger { flex: 0 1 640px; }
.dks-council .dks-verdict { flex: 1 1 1120px; max-width: 1140px; }
.dks-dialog .dks-who { font-size: 28px; letter-spacing: 4px; color: var(--dks-ink); opacity: 1; margin-bottom: 6px; }
.dks-dialog .dks-say { font-size: 38px; line-height: 1.32; }
.dks-dialog .dks-bubble.dks-action .dks-say { color: #c3c8d8; }
.dks-ruled .dks-dialog { display: none; }
.dks-speaking .dks-duck { filter: drop-shadow(0 0 14px currentColor); }

/* ── props: placards and the gavel ──────────────────────────────────────── */
.dks-prop {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(var(--duck-bottom) + var(--duck) * 0.92);
    display: flex;
    justify-content: center;
    z-index: 3;
    pointer-events: none;
}
.dks-placard {
    padding: 4px 10px;
    font-size: 24px;
    letter-spacing: 2px;
    font-weight: 900;
    color: #0b0a0c;
    background: var(--c, var(--abstain));
    border-radius: 3px;
    box-shadow: 0 0 14px var(--c, transparent);
    animation: dks-placard 0.42s cubic-bezier(.2,1.7,.5,1) both;
}
.dks-placard.approve { --c: var(--approve); }
.dks-placard.reject  { --c: var(--reject); }
.dks-placard.abstain { --c: var(--abstain); }
.dks-placard.upside  { transform: rotate(180deg); }            /* the Council is not sure what Rubber III is */
.dks-placard.upside  { animation-name: dks-placard-upside; }
.dks-placard.never   { background: rgba(10, 9, 14, 0.85); color: var(--abstain); box-shadow: none; border: 1px dashed var(--abstain); }

.dks-gavel {
    position: absolute;
    right: -4%;
    bottom: calc(var(--seat-h) * 0.27);
    width: calc(var(--seat-h) * 0.42);
    height: calc(var(--seat-h) * 0.42);
    z-index: 4;
    pointer-events: none;
    opacity: 0;                                        /* only there while it strikes */
}
.dks-gavel svg { width: 100%; height: 100%; }
.dks-gavel .gv-head { transform-origin: 82% 82%; transform-box: view-box; }
.dks-gavel.dks-strike { animation: dks-gavel-show 1.3s ease-out both; }
.dks-gavel.dks-strike .gv-head { animation: dks-gavel 0.42s cubic-bezier(.5,0,.6,1.4) both; }
.dks-gavel .gv-ring { transform-box: fill-box; transform-origin: center; opacity: 0; }
.dks-gavel.dks-strike .gv-ring { animation: dks-ring 0.6s 0.16s ease-out both; }

/* ── entrance (CONVENE) ─────────────────────────────────────────────────── */
.dks-pre .dks-duck { opacity: 0; }
.dks-convene .dks-duck { animation: dks-waddle 0.9s ease-out both; }
.dks-convene .dks-seat-0 .dks-duck { animation-delay: 0.68s; }               /* the chair arrives last */
.dks-convene .dks-seat-1 .dks-duck { animation-delay: 0.12s; }
.dks-convene .dks-seat-2 .dks-duck { animation-name: dks-glide; animation-delay: 0.3s; animation-timing-function: linear; } /* a toy does not waddle */
.dks-convene .dks-seat-3 .dks-duck { animation-name: dks-waddle-r; animation-delay: 0.22s; }
.dks-convene .dks-seat-4 .dks-duck { animation: dks-fade 1.2s 0.5s ease-in both; }  /* he does not walk in; he is simply there */

/* ── rule ───────────────────────────────────────────────────────────────── */
.dks-rule .dks-seat { opacity: 0.42; }
.dks-rule .dks-seat.dks-ruling { opacity: 1; }
.dks-ruling .dks-duck { transform: translateY(-5%) scale(1.09); }
.dks .tb-bloom, .dks .dc-bloom { opacity: 0; transition: opacity 0.6s; }
.dks-ruling .tb-bloom, .dks-ruling .dc-bloom, .dks-talking .tb-bloom, .dks-talking .dc-bloom { opacity: 1; }

/* ── panels ─────────────────────────────────────────────────────────────── */
.dks-lower {
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: stretch;
    width: 100%;
    max-width: 1800px;
    margin-top: 14px;
    flex-wrap: wrap;
}
.dks-panel {
    flex: 1 1 700px;
    max-width: 1040px;
    padding: 14px 24px;
    border: 1px solid var(--dks-dim);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.02);
    text-align: left;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s, transform 0.4s;
}
.dks-panel.dks-on { opacity: 1; transform: none; }
.dks-panel-h { font-size: 26px; letter-spacing: 3px; opacity: 0.8; margin-bottom: 8px; }

.dks-actions { display: flex; gap: 20px; justify-content: center; margin-top: 14px; min-height: 72px; }
.dks-btn {
    font: inherit;
    font-size: 32px;
    letter-spacing: 3px;
    font-weight: 900;
    padding: 14px 34px;
    color: var(--dks-ink);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid currentColor;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.3s, transform 0.15s, background 0.15s;
}
.dks-btn:hover, .dks-btn:focus-visible { background: rgba(255, 255, 255, 0.1); transform: translateY(-1px); outline: none; }
.dks-btn[hidden] { display: none; }
.dks-btn.dks-alt { color: #bb88dd; }
.dks-btn-note { font-size: 24px; letter-spacing: 1px; opacity: 0.7; margin-top: 4px; }
.dks-skip {
    position: absolute;
    top: 10px; right: 14px;
    z-index: 50;                                       /* above any full-screen layer a scene adds later */
    font: inherit;
    font-size: 26px;
    letter-spacing: 3px;
    color: inherit;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--dks-dim);
    border-radius: 6px;
    padding: 8px 16px;
    opacity: 0.8;
    cursor: pointer;
}
.dks-skip:hover { opacity: 1; }
.dks-skip[hidden] { display: none; }
.dks-hint { position: absolute; bottom: 8px; left: 0; right: 0; font-size: 24px; letter-spacing: 2px; opacity: 0.5; pointer-events: none; }
.dks-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ═══ THE DUCKY COUNCIL ════════════════════════════════════════════════════ */
.dks-council { --dks-ink: #e8c547; --dks-dim: rgba(232, 197, 71, 0.35); }

/* the ledger */
.dks-ledger-row { display: grid; grid-template-columns: 220px 1fr auto; align-items: center; gap: 12px; font-size: 30px; letter-spacing: 1px; min-height: 44px; opacity: 0; transition: opacity 0.3s; }
.dks-ledger-row.dks-on { opacity: 1; }
.dks-ledger-row .lv { color: #d8d3c0; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dks-pips { display: flex; gap: 5px; }
.dks-pip { width: 16px; height: 16px; border: 1px solid currentColor; border-radius: 2px; opacity: 0.35; }
.dks-pip.neg { color: var(--reject); border-radius: 50%; }
.dks-pip.lit { opacity: 1; background: currentColor; animation: dks-pip 0.28s cubic-bezier(.2,1.8,.5,1) both; }

/* the grade track */
.dks-track { position: relative; margin-top: 10px; opacity: 0; transition: opacity 0.4s; }
.dks-track.dks-on { opacity: 1; }
.dks-bands { display: flex; height: 36px; border-radius: 3px; overflow: hidden; }
.dks-band { position: relative; border-right: 1px solid rgba(0,0,0,0.6); font-size: 24px; line-height: 36px; letter-spacing: 0; color: #0b0a0c; overflow: hidden; font-weight: 900; text-align: center; opacity: 0.38; transition: opacity 0.4s; }
.dks-band.dks-hit { opacity: 1; }
.dks-rail { position: absolute; left: 0; top: -6px; width: 100%; height: 48px; transform: translateX(0%); transition: transform 1.1s cubic-bezier(.3,1.2,.5,1); pointer-events: none; }
.dks-rail::before { content: ''; position: absolute; left: -1px; top: 0; width: 2px; height: 100%; background: #fff; box-shadow: 0 0 8px #fff; }
.dks-score { margin-top: 8px; font-size: 28px; letter-spacing: 3px; opacity: 0.9; }

/* the medal and ruling */
.dks-verdict { display: grid; grid-template-columns: 112px 1fr; column-gap: 22px; align-items: center; text-align: left; }
.dks-verdict .dks-medal { grid-row: 1 / 3; }
.dks-verdict .dks-lines { grid-column: 1 / -1; }
.dks-medal { width: 112px; height: 112px; color: var(--grade, var(--dks-ink)); }
.dks-medal > svg { width: 100%; height: 100%; }
.dks-verdict.dks-on .dks-medal { animation: dks-medal 0.6s cubic-bezier(.2,1.5,.4,1) both; }
.dks-grade-label { align-self: end; font-size: 42px; line-height: 1.1; letter-spacing: 2px; font-weight: 900; color: var(--grade); }
.dks-reward { align-self: start; margin-top: 4px; font-size: 30px; letter-spacing: 1px; color: var(--grade); opacity: 0.85; }
.dks-lines { margin-top: 12px; font-size: 30px; line-height: 1.38; color: #dcd8c8; }
.dks-lines div + div { margin-top: 4px; }
.dks-lines div { opacity: 0; transition: opacity 0.5s; }
.dks-lines div.dks-on { opacity: 1; }

/* grade moods */
.dks-sigil { position: absolute; left: 50%; top: 4%; width: calc(var(--seat-h) * 0.95); height: calc(var(--seat-h) * 0.95); margin-left: calc(var(--seat-h) * -0.475); color: #cceeff; opacity: 0; pointer-events: none; z-index: 0; transition: opacity 1.2s; }
.dks-sigil svg { width: 100%; height: 100%; animation: dks-spin 18s linear infinite; }
.dks-grade-platinum .dks-sigil { opacity: 0.9; }
.dks-grade-platinum .dks-backdrop, .dks-grade-gold .dks-backdrop { animation: dks-glow 2.4s ease-in-out infinite alternate; }
.dks-grade-tarnished .dks-backdrop { opacity: 0.4; transition: opacity 1s; }
.dks-grade-quacked { --dks-ink: #ff7a55; }
.dks-grade-quacked .dks-backdrop { opacity: 0.3; transition: opacity 1s; }
.dks-feather { position: absolute; top: 0; left: 62%; width: 36px; height: 62px; color: #e9e6dc; opacity: 0; pointer-events: none; z-index: 6; }
.dks-grade-quacked .dks-feather { animation: dks-feather 6.5s 0.4s ease-in-out both; }

/* ═══ THE DUCK TRIBUNAL ════════════════════════════════════════════════════ */
.dks-tribunal { --dks-ink: #8f9fd6; --dks-dim: rgba(143, 159, 214, 0.32); --seat-w: calc(var(--seat-h) * 116 / 148); --duck: calc(var(--seat-h) * 70 / 148); --duck-bottom: calc(var(--seat-h) * 44 / 148);
    background: radial-gradient(ellipse 60% 55% at 50% 22%, rgba(140, 160, 255, 0.07), transparent 70%), #05050a; }
.dks-tribunal[data-register="sentencers"]   { --dks-ink: #d9788a; --dks-dim: rgba(217, 120, 138, 0.32); }
.dks-tribunal[data-register="bureaucrats"]  { --dks-ink: #8fb8b0; --dks-dim: rgba(143, 184, 176, 0.32); }
.dks-tribunal[data-register="philosophers"] { --dks-ink: #d8c86a; --dks-dim: rgba(216, 200, 106, 0.32); }
.dks .tb-recess.pf  { fill-opacity: 0.05; }
.dks .tb-benchtop.pf, .dks .tb-benchface.pf { fill-opacity: 0.14; }
.dks .tb-shadow.pf  { fill-opacity: 0.25; stroke: none; }
.dks .tb-cone.pf, .dks .dc-cone.pf { fill-opacity: 0.06; stroke: none; }
.dks .tb-bloom.pf, .dks .dc-bloom.pf { fill-opacity: 0.14; stroke: none; }
.dks .p-redact.pf { fill-opacity: 0.85; stroke: none; }
.dks .p-scan, .dks .tb-moulding, .dks .dc-moulding { stroke-width: 1; opacity: 0.45; }
.dks .tb-seal, .dks .dc-seal, .dks .dc-dome { opacity: 0.35; stroke-width: 1.4; }
.dks .tb-cord, .dks .dc-ribbon { opacity: 0.4; stroke-width: 1.4; }

/* the silent one is already seated when the lights come up, and never moves */
.dks-tribunal.dks-pre .dks-seat-4 .dks-duck { opacity: 1; }
.dks-tribunal.dks-convene .dks-duck { animation: dks-rise 0.6s cubic-bezier(.2,1.4,.5,1) both; }
.dks-tribunal.dks-convene .dks-seat-0 .dks-duck { animation-delay: 0.27s; }
.dks-tribunal.dks-convene .dks-seat-1 .dks-duck { animation-delay: 0.09s; }
.dks-tribunal.dks-convene .dks-seat-2 .dks-duck { animation-delay: 0s; }
.dks-tribunal.dks-convene .dks-seat-3 .dks-duck { animation-delay: 0.18s; animation-name: dks-rise; }
.dks-tribunal.dks-convene .dks-seat-4 .dks-duck { animation: none; }

/* the bench confers — everyone leans to the centre, the silent one does not */
.dks-confer .dks-seat-0 .dks-duck { transform: translateX(22%) rotate(4deg); }
.dks-confer .dks-seat-1 .dks-duck { transform: translateX(12%) rotate(3deg); }
.dks-confer .dks-seat-3 .dks-duck { transform: translateX(-14%) rotate(-3deg); }
.dks-confer-dots { display: inline-flex; gap: 10px; margin-left: 14px; vertical-align: middle; }
.dks-confer-dots i { width: 14px; height: 14px; border: 1px solid currentColor; border-radius: 50%; transition: background 0.3s; }
.dks-confer-dots i.dks-on { background: currentColor; }

/* the dock and the docket */
.dks-dock { flex: 0 0 auto; width: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.75; }
.dks-dock svg { width: 100%; height: auto; }
.dks .tb-dock-floor.pf { fill-opacity: 0.12; stroke: none; }
.dks .tb-dock-rail, .dks .tb-dock-post { stroke-width: 2; }
.dks-dock-label { font-size: 24px; letter-spacing: 1px; line-height: 1.3; opacity: 0.8; margin-top: 6px; max-width: 230px; }

.dks-docket {
    position: relative;
    flex: 1 1 1100px;
    max-width: 1420px;
    padding: 14px 26px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 40px;
    align-content: start;

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   THE DUCK CAST — FIVE MEMBERS, HAND-AUTHORED, ONE SET SERVING BOTH PANELS.

   Owner, 2026-08-31: *"I don't want the art that is used for the duck rain to be
   used for the tribunal/council."* Brief: `ART_NEVER_MADE.md` §25.

   ⭐⭐ THIS REINSTATES AN INSTRUCTION THAT WAS ARGUED DOWN, AND THE ARGUMENT WAS
   SOUND AT THE TIME. `DUCK_TRIBUNAL.md` §9 asked for *"a very detailed and
   animated SVG"* of five judges. §10 measured the screen, found the owner's
   rasters ALREADY on the bench, and redirected the SVG to the courtroom on the
   grounds that a third depiction of the same five ducks would have been the bug
   the complaint was about, drawn better. That reasoning rested on one premise —
   **the rasters were the cast** — and the owner has now removed it. ▶ The plan was
   right; it was right for a reason that had not arrived yet.

   ⛔⛔ THE HARD PART IS NOT THE WIRING, IT IS THAT A DUCK HAS NO STRAIGHT LINES.
   This project has already shipped an unrecognisable one: `gen_ui_plates.js` has
   `box · fill · line · poly · ring · plate · scan · arc` and **no curve primitive
   at all**, so its duck came out as a hexagonal bag with a circle balanced on it —
   the owner called it a motorcycle helmet on sight — and every suite in the build
   passed while it was on screen. ▶ **A suite cannot see that a shape is
   unrecognisable.** The only check that works is `tools/probe_cast.js`: render it,
   screenshot it at the sizes it actually ships at, and LOOK.

   ⭐ WHY VECTOR AND NOT A NEW RASTER SET. Three reasons, and the third decided it:
     1. `currentColor` — the cast re-tints with the room under the per-chapter
        palette. A raster cast would sit fixed inside furniture that moves.
     2. ~1 KB against ~50 KB, five files against zero.
     3. ⭐ **The R1 opaque-box hazard stops existing.** Both panels put a
        `drop-shadow` on the member, which follows the ALPHA channel — with rasters
        that meant measuring corner alpha before every swap, because an opaque one
        grows a glowing square. A vector has no corners to measure.

   ⭐ ONE CAST, FIVE INDIVIDUALS — the silhouette is SHARED and only the marks
   differ. Five separately-drawn birds would read as five species; the same body
   five times with different wear reads as a panel of people, which is what both
   fictions need. ⚠ `SILHOUETTE` is therefore one literal shared constant below,
   not five near-copies.

   ⭐⭐ AND THE CHARACTERISATION SURVIVES THE WITHDRAWAL. The old casting joke was
   carried by the damage ladder — `duck_rain1` factory-new for THE ABSTAINER
   (*nothing has ever touched him*), `duck_rain5` for CHAIRMAN QUACK (*the most
   worn thing on the bench presides*), `duck_rain6`'s shards for RUBBER III
   (*"The Council is not sure what Rubber III is"*). That ladder is gone, so the
   wear is drawn EXPLICITLY here as `marks[]` — 3 · 1 · seams · 1 · **0**. ▶ The
   joke is not inherited from a filename any more; it is in the drawing.

   ⛔ NO COLOUR IS BAKED IN. Every shape strokes `currentColor` and fills through
   `.pf`, same contract as `ui_plates.js`, `duck_tribunal_art.js` and
   `duck_council_art.js`. A hex here would survive a theme change nothing else did.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
    'use strict';

    /* ── THE BOX ─────────────────────────────────────────────────────────────
       ⚠ SQUARE ON PURPOSE, and it is a wiring decision rather than a drawing one.
       Both panels size the member into a SQUARE slot inherited from the 256×256
       rasters — `.tribunal-duck-img` is `w = h = --tb-h × 0.4730`, `.duck-img` is
       `height:46%` at 1:1. A non-square viewBox would letterbox inside that slot
       and shrink the cast without a single rule changing. The duck is drawn to
       fill 112×112 with its feet ON the bottom edge, because both panels
       bottom-anchor the slot to the bench line. */
    var VW = 112, VH = 112;

    /* ══ THE SHARED SILHOUETTE — ONE CLOSED PATH ═════════════════════════════
       ⛔⛔ ONE PATH, NOT FIVE PARTS, AND THAT IS THE WHOLE LESSON OF THE FIRST
       DRAFT. Rendered 2026-09-01, the first version drew body · head · beak ·
       wing · tail as five separate closed shapes, each filled and each stroked.
       It read as **a circle balanced on a bag with a nozzle stuck to it** — which
       is, precisely, the motorcycle-helmet failure again, only with better curves.
       Three faults, all of them structural rather than a matter of taste:
         1. two stroked outlines meeting at the neck draw a SEAM across it, so the
            head reads as a separate object resting on the body;
         2. the bill, entered as its own closed shape, has a vertical left edge
            where it overlaps the head — a hard line no bird has;
         3. two translucent fills overlapping doubled to a darker patch exactly
            where the neck should be continuous.
       ▶ A silhouette is ONE outline. Everything else is interior detail drawn ON
       it. Fill once, stroke once, and the animal is a single creature.

       ⚠ THE BILL IS PART OF THE OUTLINE (segments 8–10). It cannot be an add-on:
       at the 44–68px these ship at, the wedge is the single feature that says
       "duck" rather than "bird", so it has to be continuous with the head or it
       reads as a beak-shaped sticker.

       Three-quarter view: body to the viewer, head turned so the bill is in
       profile. ⭐ That choice is the legibility argument. Head-on, a duck is a blob
       with a triangle on it; in pure profile it reads perfectly but cannot look at
       you — and BOTH panels' animations are about being looked at (the tribunal's
       DELIBERATE turns the bench, the Council's VOTE names each member in turn).
       Three-quarter is the only view that does both.

       ⛔ THE BILL TIP IS DELIBERATELY BLUNT. Draft three met it at a sharp angle
       and it read as a bird of prey; it now carries a two-unit CAP segment between
       the lower and upper edges, and that cap is the whole difference between a
       duck and a hawk at 44px. ⚠ Not decoration — a point is the one thing an
       organic silhouette cannot have, and points are exactly what made the
       generated version read as a polygon.

       ⛔⛔ AND THE TAIL TAUGHT THE SAME LESSON THE HARD WAY. Draft three's tail
       came to a spike, so draft four blunted the spike — and made it WORSE, a
       broad flipper. Rendering both showed the tip was never the fault: the tail
       sat at SHOULDER HEIGHT, level with the neck, so whatever shape it was given
       it read as a second appendage growing out of the shoulder. ▶ **It was a
       position error being fixed as a shape error.** The back now slopes down from
       the nape and the tail is a small stub at the LOW rear, which is where a duck
       keeps one. ⚠ Worth remembering the next time a shape is wrong: check where
       it IS before redrawing what it is.
       ⚠ It took two further passes after that to settle, and both were the same
       correction again — smaller, and lower. A tail that projects 11 units at 66%
       of the height reads as a tail; the same shape at 55% and 18 units long read
       as a flipper. **Size and position, not silhouette.**

       ⛔⛔ THE MARGIN IS NOT WHITESPACE, IT IS CHAIRMAN QUACK'S. He is drawn at
       `scale: 1.06` about his own feet, so every unit of the drawing moves 6% further
       from (56,111) — and at the first attempt the crown sat at y≈4 and the bill cap
       at x=109, which put both OUTSIDE the box once he was grown. `qa_duck_cast`
       caught it as `outOfBox 1`.
       ⚠ The tempting fix is `overflow: visible` on the slot, and game.css bans it in
       as many words twenty lines from where this cast is painted: art that escapes its
       viewBox *"overlaps its neighbours instead of being clipped, which trades a sliced
       edge for a collision."* Both panels tile their furniture EDGE TO EDGE — that is
       what makes five stalls read as one bench — so an overhanging member lands in the
       next member's stall. ▶ The drawing gives the room back instead: crown at y≥9,
       bill cap at x≤107, which leaves 1.06 inside the box with the stroke on.

       Clockwise from the tail tip. */
    var SILHOUETTE =
          'M12,74'                         /* tail tip — LOW and blunt, see above */
        + ' C15,79 19,83 23,86'            /* the tail's underside into the flank */
        + ' C16,92 13,101 20,107'          /* left flank, out and down */
        + ' C27,111 41,111 58,111'         /* the waterline, left half */
        + ' C76,111 90,110 95,102'         /* the waterline, right half */
        + ' C101,93 99,78 90,70'           /* right flank rising */
        + ' C84,65 76,62 70,58'            /* the shoulder, sloping in */
        + ' C66,55 67,49 71,45'            /* ▶ THE CHIN NOTCH — concave */
        + ' C74,42 76,41 79,41'            /* the root of the bill */
        + ' C88,43 99,42 104,38'           /* ▶ lower bill, out to the tip */
        + ' C107,36 107,31 104,29'         /* ▶ THE BLUNT CAP — see the note above */
        + ' C97,24 89,21 79,22'            /* ▶ upper bill, back to the root */
        + ' C85,17 80,12 70,10'            /* the brow above the bill */
        + ' C56,9 41,15 37,25'             /* over the crown */
        + ' C33,32 35,42 40,47'            /* the back of the head */
        + ' C43,50 42,54 38,57'            /* ▶ THE NAPE NOTCH — concave */
        + ' C33,62 27,68 23,74'            /* ▶ THE BACK, SLOPING DOWN to the tail */
        + ' C19,73 15,73 12,74 Z';         /* the tail's upper edge, closing */

    /* ── INTERIOR DETAIL ─────────────────────────────────────────────────────
       Drawn ON the silhouette, never through it. ⚠ All of it is OPEN strokes: a
       closed interior shape is what made the first draft's wing read as a fish
       lying on the belly. */

    /* Where the bill leaves the head. One short curve does what the old vertical
       seam did, without asserting an edge that is not there. */
    var BILL_ROOT = 'M79,22 C75,28 75,35 78,41';
    /* The mouth. ⭐ THE ABSTAINER DOES NOT GET THIS ONE — see `mute`. */
    var BILL_LINE = 'M84,32 C92,33 100,32 105,31';
    /* ⛔ THE WING TOOK THREE DRAFTS AND EACH FAILED DIFFERENTLY — worth recording,
       because all three were one mistake seen from different angles:
         1. a closed lens in the middle of the belly — read as a FISH lying on it;
         2. two horizontal crescents — read as a FROWN;
         3. two swept arcs — read as SPEED LINES: scratches, not a limb.
       ▶ A folded wing has THICKNESS and a ROOT. One crescent tucked under the
       shoulder and angled down-back has both; a stroke of any shape, anywhere on
       the flank, has neither. ⚠ It is also the only interior shape that is closed
       and filled, which is what separates it from the marks.
       ⚠ Both ends are ROUNDED rather than cusped, for the same reason the bill
       tip is: draft four's two-cusp version read as a leaf lying on the body. */
    var WING = 'M75,69 C63,70 48,79 39,92 C44,95 51,93 57,89'
             + ' C66,83 73,76 77,71 C78,69 77,68 75,69 Z';

    /* ── THE FIVE ────────────────────────────────────────────────────────────
       ⚠ INDEX ORDER IS LOAD-BEARING AND IT IS SHARED BY BOTH PANELS. The Council's
       `DUCKS` table is CHAIRMAN QUACK · DR. MALLARD · RUBBER III · SENATOR DUCK ·
       THE ABSTAINER, and the tribunal's `JUDGES[4]` is the stall that never moves
       in any beat. ⭐ Those already agree: index 4 is THE ABSTAINER, who has never
       voted, so the silent stall and the abstention are one joke told twice.
       `qa_duck_cast` asserts the two agree rather than trusting this comment.

       ⛔ The tribunal REDACTS its nameplates and this cast is named. Not a
       contradiction — the point: the same five bodies sit on both benches, and the
       anonymity is theatre. Names live in game.js; only the index is here.

       ⚠⚠ EVERY DISTINGUISHING FEATURE IS SILHOUETTE-ADJACENT, AND THAT IS A
       MEASURED CONSTRAINT RATHER THAN A STYLE. `ART_NEVER_MADE` §7–12, learned on
       the raster ladder these replace: *silhouette changes read; surface changes do
       not.* `duck_rain2` was skipped from the Council for exactly this reason — a
       hairline crack is invisible at 44px. So the five are told apart by things
       that break an OUTLINE: the Chairman is bigger and carries a medal that
       overhangs his chest, the Doctor's spectacles cut the head's edge, the
       Senator wears a FILLED band, Rubber III has no wing at all, and the
       Abstainer is the only one with nothing on him. ⛔ A tint or a shade here
       would be invisible in the only panel that matters. */
    var MEMBERS = [
        {
            key: 'chair', name: 'CHAIRMAN QUACK',
            /* Presides, and wears it. Drawn 6% larger FROM THE FEET, which is the
               cheapest way to say "presiding" without a second silhouette. */
            scale: 1.06, regalia: 'chain',
            /* The most worn thing on the bench presides. Three marks. */
            marks: ['crown', 'flank', 'bill'],
            eye: 'open'
        },
        {
            key: 'mallard', name: 'DR. MALLARD',
            scale: 1.0, regalia: 'specs',
            marks: ['flank'],
            eye: 'open'
        },
        {
            key: 'rubber', name: 'RUBBER III',
            /* ⛔⛔ THE ONE THAT MUST NOT READ AS A DUCK, and the game's own verdict
               text says why: *"The Council is not sure what Rubber III is."* ⚠ He
               keeps the SHARED silhouette — he is on the bench, and a different
               outline would make him a different species rather than an uncertain
               member. Every other detail says manufactured object instead: a mould
               parting seam from crown to base, a squeaker valve underneath, a
               crack, an eye socket with nothing in it — and ⭐ **no wing**, because
               a moulded bath toy does not have one. That last is the only one of
               his tells that survives 44px, which is why he has it. */
            scale: 0.97, regalia: 'none',
            marks: ['seam', 'valve', 'crack'],
            eye: 'blank', nowing: true
        },
        {
            key: 'senator', name: 'SENATOR DUCK',
            scale: 1.0, regalia: 'sash',
            marks: ['flank'],
            eye: 'open'
        },
        {
            key: 'abstainer', name: 'THE ABSTAINER',
            /* ⭐⭐ PRISTINE, AND THE BLANK IS THE CHARACTERISATION. He has never
               voted; nothing has ever touched him. No regalia, no marks, and — the
               detail that costs nothing and says the most — **no bill line**,
               because it has never opened. ⚠ `marks: []` is deliberate and
               `qa_duck_cast` asserts it stays empty. The one thing he gets that
               nobody else does is a factory shine on the crown, so he reads as NEW
               rather than unfinished: a member with no detail at all looks like a
               bug, and this is one stroke of the difference. */
            scale: 1.0, regalia: 'none',
            marks: [],
            eye: 'open', shine: true, mute: true
        }
    ];

    /* ── WEAR ────────────────────────────────────────────────────────────────
       Open strokes that sit across an edge, never a wash. */
    var MARKS = {
        /* ⚠ THESE FOLLOW THE CROWN, AND THE CROWN MOVED. When the silhouette was
           lowered 5 units to make room for CHAIRMAN QUACK's 1.06, this notch and THE
           ABSTAINER's shine stayed where they were and rendered as a V and an arc
           FLOATING ABOVE two bald heads. ▶ A mark that sits on an edge has to move
           with the edge; nothing links them but this note and probe_cast. */
        crown: '<path d="M48,18 L53,11 L59,18" class="dk-mark"/>',
        flank: '<path d="M26,92 C32,88 38,89 42,93" class="dk-mark"/>',
        bill:  '<path d="M95,29 L99,33" class="dk-mark"/>',
        seam:  '<path d="M57,7 C51,32 50,56 55,80 C58,94 57,104 58,110" class="dk-seam"/>',
        crack: '<path d="M32,86 L40,81 L44,90 L53,84" class="dk-mark"/>',
        valve: '<circle cx="57" cy="100" r="5.4" class="dk-valve"/>'
             + '<path d="M51.6,100 L62.4,100" class="dk-valve"/>'
    };

    /* ── REGALIA ─────────────────────────────────────────────────────────────
       ⭐ What each one wears is the only place the two panels' fictions differ, and
       it is drawn to survive BOTH readings: the tribunal charges you and the
       Council grades you, so a chain of office reads as authority either way.
       ⚠ It all sits on the CHEST, above `WING` — an earlier draft put the medal
       through the wing and the cluster read as a fishing hook. */
    var REGALIA = {
        chain: '<path d="M42,62 C53,74 67,72 76,60" class="dk-chain"/>'
             + '<circle cx="58" cy="73" r="5" class="dk-medal"/>'
             + '<circle cx="58" cy="73" r="2.1" class="dk-medal pf"/>',
        specs: '<circle cx="68" cy="24" r="8" class="dk-specs"/>'
             + '<circle cx="50" cy="28" r="6.4" class="dk-specs"/>'
             + '<path d="M59,26 C61,24 62,24 60,27" class="dk-specs"/>',
        /* ⭐ FILLED, not two lines. Two thin diagonals read as a scribble at 44px;
           a solid band still reads as a sash. ⚠ Over ONE shoulder and down to the
           opposite flank — a horizontal band across the belly reads as a bandage,
           and so did a WIDE diagonal one, which is why this one is narrow and
           carries a pin at the shoulder. */
        sash:  '<path d="M68,60 C64,75 54,87 37,94 L33,88 C48,81 56,70 59,58 Z" class="dk-sash pf"/>'
             + '<path d="M68,60 C64,75 54,87 37,94 L33,88 C48,81 56,70 59,58 Z" class="dk-sash-line"/>'
             + '<circle cx="64" cy="63" r="3.4" class="dk-medal"/>',
        none:  ''
    };

    function open(cls, extra) {
        return '<svg class="ui-plate duck-cast ' + cls + '" viewBox="0 0 ' + VW + ' ' + VH + '"'
             + ' xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2.6"'
             + ' stroke-linecap="round" stroke-linejoin="round" preserveAspectRatio="xMidYMax meet"'
             + ' ' + extra + ' aria-hidden="true" focusable="false">';
    }

    /* ── ONE MEMBER ──────────────────────────────────────────────────────────
       ⚠ THE CALLER PASSES ITS OWN SLOT CLASS, and that is a boundary rather than a
       convenience. `tribunal-duck-img` and `duck-img` name a POSITION in each panel
       — both names predate the art being a vector, and game.css, `qa_tribunal_art`,
       `probe_tribunal` and `probe_council` all key off them. ▶ This module knows how
       to draw a duck and nothing about where either panel puts one.
       ⚠ THE SCALE GOES ON AN INNER <g>, NOT ON THE ROOT. Both panels animate the
       member element's own `transform` — the tribunal's LEAN and RULE, the
       Council's MUTTER — and a transform on the root would be overwritten by the
       first beat that fires, silently un-sizing the Chairman mid-scene. Anchored
       at the feet (`56,111`) so growing him does not lift him off the bench. */
    function duck(i, slot) {
        var m = MEMBERS[i] || MEMBERS[1];
        var s = open('dcast-' + m.key + (slot ? ' ' + slot : ''), 'data-cast="' + i + '"');

        s += m.scale !== 1
            ? '<g transform="translate(56,111) scale(' + m.scale + ') translate(-56,-111)">'
            : '<g>';

        /* ⭐ THE ANIMAL: one fill, one stroke, one outline. */
        s += '<path d="' + SILHOUETTE + '" class="dk-body pf"/>';
        s += '<path d="' + SILHOUETTE + '" class="dk-body-line"/>';

        /* Interior detail, back to front. */
        s += '<path d="' + BILL_ROOT + '" class="dk-billroot"/>';
        if (!m.mute) s += '<path d="' + BILL_LINE + '" class="dk-billline"/>';
        if (!m.nowing) {
            s += '<path d="' + WING + '" class="dk-wing pf"/>';
            s += '<path d="' + WING + '" class="dk-wing-line"/>';
        }

        /* The eye. ⛔ RUBBER III's is an empty socket — a ring with nothing in it,
           which is the cheapest way to draw "there is no one home" at 44px. */
        s += m.eye === 'blank'
            ? '<circle cx="68" cy="24" r="5" class="dk-socket"/>'
            : '<circle cx="68" cy="24" r="4.6" class="dk-eye pf"/>';

        /* Factory shine — THE ABSTAINER only. New, not unfinished. */
        if (m.shine) s += '<path d="M41,25 C46,16 56,12 66,13" class="dk-shine"/>';

        s += REGALIA[m.regalia] || '';
        for (var k = 0; k < m.marks.length; k++) s += MARKS[m.marks[k]] || '';

        return s + '</g></svg>';
    }

    window.DuckCast = {
        duck: duck, MEMBERS: MEMBERS, VW: VW, VH: VH, COUNT: MEMBERS.length,
        SILHOUETTE: SILHOUETTE,
        /* The index that never moves and never votes. Exported so the tribunal's
           SILENT stall and the Council's abstention can be asserted to agree
           instead of drifting apart in two files. */
        ABSTAINER: 4
    };
})();

</script>
<script>

     | | Tribunal | Council |

     | the board behind | dimmed and blurred            | **fully lit**: HUD, nav, six live notifications |
     | the five         | seated at a bench             | **five bordered tiles**, reading as a shop grid |
     | animating at rest| three named beats             | ⛔ **zero elements, zero keyframes** |

   ⛔⛔ THE REAL FAULT IS THAT IT NEVER TAKES THE SCREEN. The tribunal stages a
   scene; the Council is a dialog box floating on a live dashboard. That — more
   than the art — is what "added on last minute" actually looks like.

   ⭐ DELIBERATELY NOT THE SAME ROOM. The tribunal is a straight bench: angular
   stalls, square nameplates, names redacted. The Council is a **curved dais** with
   rounded high-backed chairs and a rosette on each desk, because it is a different
   body doing a different thing — it *grades* you, where the tribunal *charges* you.
   `event_ducky_council` already draws a struck medal on a ribbon for exactly that

   ⚠ IT ADDS, IT NEVER REPLACES. `#ducky-council-ducks` is INTERACTIVE — every
   `.duck-card` carries an onclick into `RubberIII`, and `qa_glyph_wiring` asserts
   the cards survive. The chamber is drawn BEHIND them; not one card is rebuilt.

   ⛔ NO COLOUR IS BAKED IN. Every shape strokes `currentColor` and fills via `.pf`,
   so `game.css`'s per-chapter palette reaches the chamber — same contract as

(function () {
    'use strict';

    /* ── SEAT GEOMETRY ───────────────────────────────────────────────────────
       ⚠ Shared with game.css exactly as the tribunal's are: the CSS box is
       derived from one custom property, width = height × SW/SH, and the duck sits
       at (SH - SEAT_TOP) / SH of the height. `qa_council_art` asserts the ratios
       rather than trusting this comment. */
    var SW = 112, SH = 150, SEAT_TOP = 108;

    /* Five members, and the rosette on each desk says what they are. ⚠ These are
       NOT redaction bars — the tribunal redacts because it is anonymous; the
       Council is proud of itself and puts its rank on the desk. */
    var SEATS = [
        { pips: 3, chair: 'tall'  },   // CHAIRMAN QUACK — presides
        { pips: 2, chair: 'mid'   },   // DR. MALLARD
        { pips: 0, chair: 'low'   },   // RUBBER III — nobody is sure what he is
        { pips: 2, chair: 'mid'   },   // SENATOR DUCK
        { pips: 1, chair: 'mid'   }    // THE ABSTAINER
    ];

    function open(cls, vb, extra) {
        return '<svg class="ui-plate ' + cls + '" viewBox="' + vb + '" xmlns="http://www.w3.org/2000/svg"'
             + ' fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"'
             + ' ' + extra + ' aria-hidden="true" focusable="false">';
    }

    /* ── ONE SEAT ────────────────────────────────────────────────────────────
       A high-backed chair on a step, and the desk in front of it. The duck image
       is NOT in here — it is a sibling, so the members can lean without the
       furniture leaning with them. */
    function seat(i) {
        var s = SEATS[i] || SEATS[1];
        var top = s.chair === 'tall' ? 6 : s.chair === 'low' ? 30 : 18;
        var o = open('dc-seat', '0 0 ' + SW + ' ' + SH, 'preserveAspectRatio="xMidYMid meet"');

        /* The alcove behind the member. */
        o += '<rect x="10" y="' + (top + 4) + '" width="92" height="' + (100 - top) + '" class="dc-alcove pf"/>';

        /* ⭐ THE CHAIR — round, and that roundness is the point: `gen_ui_plates.js`
           has eight primitives and no curve, which is why the Council came out of it
           as "seven keyrings" in the first place. A high back drawn as one cubic. */
        o += '<path d="M22,106 L22,' + (top + 34) + ' C22,' + (top + 8) + ' 40,' + top
           + ' 56,' + top + ' C72,' + top + ' 90,' + (top + 8) + ' 90,' + (top + 34) + ' L90,106" class="dc-back"/>';
        o += '<path d="M31,106 L31,' + (top + 40) + ' C31,' + (top + 20) + ' 43,'
           + (top + 12) + ' 56,' + (top + 12) + ' C69,' + (top + 12) + ' 81,' + (top + 20)
           + ' 81,' + (top + 40) + ' L81,106" class="dc-back dc-back-in"/>';

        /* The bloom behind whoever is speaking. Opacity only. */
        o += '<ellipse cx="56" cy="64" rx="44" ry="50" class="dc-bloom pf"/>';

        o += '<rect x="0" y="' + SEAT_TOP + '" width="' + SW + '" height="7" class="dc-desktop pf"/>';

        o += '<path d="M0,121 Q56,129 ' + SW + ',121" class="dc-moulding"/>';

        /* ⭐ THE ROSETTE, not a redaction. Rank, worn openly. RUBBER III has none —
           the verdict text says the Council is not sure what he is. */
        if (s.pips > 0) {
            o += '<circle cx="56" cy="132" r="6.5" class="dc-rosette"/>';
            for (var k = 0; k < s.pips; k++) {
                o += '<circle cx="' + (56 + (k - (s.pips - 1) / 2) * 13) + '" cy="132" r="2.4" class="dc-pip pf"/>';
            }
        } else {
            o += '<line x1="46" y1="132" x2="66" y2="132" class="dc-moulding"/>';
        }
        return o + '</svg>';
    }

    /* ── THE CHAMBER BEHIND THEM ─────────────────────────────────────────────
       ⭐ Needs no alignment with anything, which is why the seal and the lamp live
       here rather than in the seats: a circle centred behind a row is centred
       whatever the row measures. */
    function chamber() {
        var s = open('dc-chamber', '0 0 640 300', 'preserveAspectRatio="xMidYMid slice"');
        s += '<polygon points="320,-40 500,250 140,250" class="dc-cone pf"/>';
        /* The dome: three arcs, the chamber seen from the floor. */
        s += '<path d="M60,250 A260,260 0 0 1 580,250" class="dc-dome"/>';
        s += '<path d="M120,250 A200,200 0 0 1 520,250" class="dc-dome dc-dome-in"/>';
        /* The seal — a struck medal, the same read as `event_ducky_council`. */
        s += '<circle cx="320" cy="96" r="46" class="dc-seal"/>';
        s += '<circle cx="320" cy="96" r="33" class="dc-seal"/>';
        s += '<polygon points="320,68 344,82 344,110 320,124 296,110 296,82" class="dc-seal-core"/>';
        s += '<polyline points="300,40 320,96 340,40" class="dc-ribbon"/>';
        return s + '</svg>';
    }

    window.CouncilArt = {
        seat: seat, chamber: chamber,
        SEATS: SEATS, SW: SW, SH: SH, SEAT_TOP: SEAT_TOP
    };
})();

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   THE DUCK TRIBUNAL — THE COURTROOM, HAND-AUTHORED.

   Owner, 2026-08-29, with a screenshot of the bench: *"Why is this used for the
   duck tribunal, it was supposed to be a very detailed and animated SVG."*
   Plan: `DUCK_TRIBUNAL.md` §9. This is that plan built, with ONE deviation, and
   the deviation is the whole reason to read this header.

   ⛔⛔ §9 SAID "DRAW FIVE JUDGES". MEASURING THE SCREEN SAYS DO NOT.

   the same five ducks already stacked 203px apart: the generated `event_tribunal`
   plate (11 primitives, 5 circles, 82px — the thing the owner was pointing at),
   and `#tribunal-ducks`, which is five 65px RASTERS of the owner's own art. A
   third bench would have been the bug the complaint was about, drawn better.

   ⭐ SO THE SVG IS THE COURTROOM AND THE OWNER'S ART IS THE CAST. The screenshot
   showed five ducks floating in a void with no bench, no chairs and no dock under
   them. They now sit at one. That satisfies §9's actual ask — detailed, animated,
   hand-authored, curves the generator cannot draw — without drawing a duck at all.

   ⛔⛔ AND THAT LAST CLAUSE STOPPED BEING TRUE ON 2026-09-01. The owner withdrew

   rests on: the rasters were the cast, and now there is no cast. `duck_cast_art.js`
   draws the five, and §9's original instruction — *"a very detailed and animated
   SVG"* of five judges — turned out to be right after all. ▶ **The reasoning below
   is not wrong; an input changed.** `DUCK_TRIBUNAL.md` §11.
   ▶ `event_tribunal` is unmapped from this overlay for the same reason. It stays
   in `ui_plates.js`, where `qa_glyph_wiring` still requires the key.

   ⭐ WHY THE BENCH IS A REPEATED SEGMENT AND NOT ONE WIDE PICTURE.
   The row is five inline-blocks sized in `rem`, so its width moves with the root
   font size. A single background image would have to be ALIGNED to five ducks
   whose positions are not knowable from here — the kind of measurement that is
   right once and silently wrong after any type change. Each duck instead carries
   its own stall, and the stalls abut into a continuous bench at any size.
   ⚠ `margin: 0` on `.tribunal-duck` is therefore load-bearing, not cosmetic: an
   8px gap puts a hole in the bench between every judge.

   ⭐ THE ANIMATION IS THE VERDICT, NOT AN IDLE. §9: *"A permanently-wiggling bench
   is chrome; a bench that turns to look at you is the mechanic."* Three beats,
   driven by classes `DuckTribunal` already knows when to set:
       CONVENE     the bench assembles, staggered 90ms
       DELIBERATE  slow turns, the only looping beat — 5.4s, deliberately dull
       RULE        the deciding judge leans in; everyone else goes still and dims
   ⛔ THE FIFTH STALL NEVER MOVES IN ANY BEAT. `THE SILENT ONE` is in the
   `sentencers` dialogue and has no line, and its nameplate has nothing left on it
   to redact. It is the only judge whose stillness is characterisation rather than
   a missing animation. ⭐ Stall 4 also seats `DuckCast.ABSTAINER` — the member who
   has never voted — so the silence and the abstention are one character. That
   agreement lives in three files and `qa_duck_cast` asserts it.

   ⚠ TRANSFORM AND OPACITY ONLY — see game.css. Not a style preference: anything
   else composites on the main thread, and this panel opens while the income loop
   is running.

   ⛔ NO COLOUR IS BAKED IN HERE. Every shape strokes `currentColor` and fills via
   `.pf`, exactly like `ui_plates.js`, so `game.css`'s per-chapter palette reaches
   the courtroom. A hex here would survive a theme change that nothing else did.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
    'use strict';

    /* ── STALL GEOMETRY ──────────────────────────────────────────────────────
       ⚠ THREE NUMBERS ARE SHARED WITH `game.css` AND NOTHING WILL TELL YOU WHEN
       THEY DISAGREE. The stall's CSS box is derived from a single custom property
       there — width = height × SW/SH, and the duck image is bottom-positioned at
       (SH - BENCH_TOP) / SH of the height so its feet land on the bench surface.
       `qa_tribunal_art` asserts the ratios rather than trusting this comment.

       ⛔ SH WAS 168 UNTIL THE VERDICT BEAT WAS PHOTOGRAPHED. With the verdict list

       six pixels from the clip that `MASTER_PLAN` §6.8 A2 is an open item about,
       on a panel that had 372px of headroom before this courtroom was added. The
       bench took the room, so the bench gives it back: the dead band above the
       arch is gone and the under-shadow is halved. ▶ Anything added here from now
       on is added to a panel with a measured budget — re-run `probe_tribunal`. */
    var SW = 116, SH = 148, BENCH_TOP = 104;

    /* Five judges, five different nameplates. ⚠ The bars are DISTINCT on purpose:
       five identical plates read as a repeated tile rather than five names that
       were each removed separately. The last has one bar the full width — there
       is no name under it to break up. */
    var JUDGES = [
        { bars: [22, 14, 10], silent: false },
        { bars: [16, 26],     silent: false },
        { bars: [12, 18, 12], silent: false },
        { bars: [30, 8],      silent: false },

    function open(cls, vb, extra) {

    }

    /* ── ONE STALL ───────────────────────────────────────────────────────────

       image is NOT in here — it is a sibling, because the judges turn and the

    function stall(i) {

        s += '<rect x="8" y="6" width="100" height="96" class="tb-recess pf"/>';
        s += '<line x1="30" y1="14" x2="30" y2="102" class="p-scan"/>';

        /* ⭐ THE CHAIR — and the reason this file is hand-authored at all.

        s += '<path d="M18,102 L18,40 C18,20 34,10 58,10 C82,10 98,20 98,40 L98,102" class="tb-seat"/>';
        s += '<path d="M27,102 L27,45 C27,29 40,21 58,21 C76,21 89,29 89,45 L89,102" class="tb-seat tb-seat-in"/>';

        /* The bloom that comes up behind whichever judge rules. Opacity only. */
        s += '<ellipse cx="58" cy="60" rx="46" ry="52" class="tb-bloom pf"/>';

        s += '<line x1="114" y1="16" x2="114" y2="104" class="tb-post"/>';

        /* The bench. Full-bleed left to right — this is what tiles. */
        s += '<rect x="0" y="' + BENCH_TOP + '" width="' + SW + '" height="8" class="tb-benchtop pf"/>';
        s += '<rect x="0" y="112" width="' + SW + '" height="28" class="tb-benchface pf"/>';

        s += '<rect x="28" y="121" width="60" height="14" class="tb-nameplate"/>';
        var total = 0, k;
        for (k = 0; k < j.bars.length; k++) total += j.bars[k];
        total += (j.bars.length - 1) * 4;                  // the gaps between bars
        var x = 58 - total / 2;
        for (k = 0; k < j.bars.length; k++) {
            s += '<rect x="' + x.toFixed(1) + '" y="125" width="' + j.bars[k] + '" height="6" class="p-redact pf"/>';

        return s + '</svg>';
    }

    /* ── THE BACKDROP ────────────────────────────────────────────────────────
       Seal and overhead light. ⭐ It needs NO alignment with anything, which is
       exactly why these two shapes live here rather than in the stalls: a circle
       centred behind a row is centred whatever the row measures. */
    function backdrop() {

        s += '<polygon points="320,-40 512,262 128,262" class="tb-cone pf"/>';
        s += '<circle cx="320" cy="104" r="74" class="tb-seal"/>';

        s += '<line x1="320" y1="-40" x2="320" y2="30" class="tb-cord"/>';

       ⭐ CONDUCT_ROUTES §9.5 asks that the bench read as *"OTHER ducks, and yours
       conspicuously not among them."* An empty stand in front of it is the most
       direct way to say so, and it costs no art: the absence IS the drawing.
       ⚠ It is a block after the row in a text-align:center parent, so it centres
       itself. No measurement, nothing to keep in sync. */
    function dock() {
        var s = open('tb-dock', '0 0 200 104', 'preserveAspectRatio="xMidYMid meet"');
        s += '<ellipse cx="100" cy="88" rx="76" ry="11" class="tb-dock-floor pf"/>';
        s += '<path d="M46,84 L46,36 C46,23 64,17 100,17 C136,17 154,23 154,36 L154,84" class="tb-dock-rail"/>';
        s += '<line x1="46" y1="54" x2="154" y2="54" class="tb-dock-rail"/>';
        s += '<line x1="61" y1="84" x2="61" y2="19" class="tb-dock-post"/>';
        s += '<line x1="139" y1="84" x2="139" y2="19" class="tb-dock-post"/>';

       Built here rather than in game.js so the markup and the geometry that
       depends on it stay in one file. `imgFor` is passed in because WHICH cast sits
       here is the caller's business — game.js routes it to `duck_cast_art.js` and
       owns the fallback. ⭐ That boundary is why the 2026-09-01 cast swap did not
       touch this file's geometry at all: the room never knew what it seated. */
    function bench(imgFor) {

    window.TribunalArt = {
        bench: bench, stall: stall, backdrop: backdrop, dock: dock,
        JUDGES: JUDGES, SW: SW, SH: SH, BENCH_TOP: BENCH_TOP,
        /* The duck image's share of the stall, in the same units. game.css derives
           its width, height and offsets from these three ratios. */
        IMG_UNITS: 70,

        SILENT: 4
    };
})();

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   event_audio.js — the sound engine every event scene plays through.

            try { if (window.GameMusic && GameMusic.release) GameMusic.release('event-audio'); } catch (e) {}

        return api;
    }
    function noop() {}

    window.EventAudio = {
        session: session,
        unlock: function () { ensure(); },
        setMuted: function (m) { userMuted = !!m; applyLevels(); },
        isMuted: function () { return userMuted; },
        refresh: applyLevels,                  // call after Settings' sound sliders change

})();

    D.director = function () {

            return new Promise(function (resolve) {
                if (dead) return;                       // a closed scene simply stops
                var finished = false, complete = null;
                function done() {
                    if (finished) return;
                    finished = true;

    D.say = function (dir, seats, idx, who, text, kind, opts) {

    D.GAVEL_SVG =

    D.choices = function (parent, list) {

       21:9 or a portrait screen sees. */

    D.fit = function (host, inner) {
